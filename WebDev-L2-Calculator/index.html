
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator | Sahasra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-icon icon-one">✦</div>
    <div class="bg-icon icon-two">＋</div>
    <div class="bg-icon icon-three">÷</div>

    <main class="calculator-container">

        <header class="heading">
            <div class="main-icon">✦</div>
            <h1>Calculator</h1>
            <p>Simple calculations, smarter results.</p>
        </header>

        <section class="calculator">

            <div class="display">
                <div id="previousOperand"></div>
                <input type="text" id="display" value="0" readonly
                    aria-label="Calculator display">
            </div>

            <div class="buttons">
                <button class="utility" data-action="clear">AC</button>
                <button class="utility" data-action="delete">DEL</button>
                <button class="operator" data-action="percent">%</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="+">+</button>

                <button data-action="sign">+/-</button>
                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="equal" data-action="calculate">=</button>
            </div>

        </section>

        <footer>
            <p>Made with 💜 by <strong>Sahasra Kottakota</strong></p>
            <span>Oasis Infobyte · Web Development Internship</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
