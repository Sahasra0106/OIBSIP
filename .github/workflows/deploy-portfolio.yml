
name: Deploy OIBSIP Projects

on:
  push:
    branches:
      - main
    paths:
      - 'WebDev-L1-Portfolio/**'
      - 'WebDev-L1-TemperatureConverter/**'
      - 'WebDev-L2-Calculator/**'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p _site/WebDev-L1-TemperatureConverter
          mkdir -p _site/WebDev-L2-Calculator

          cp -a WebDev-L1-Portfolio/. _site/
          cp -a WebDev-L1-TemperatureConverter/. _site/WebDev-L1-TemperatureConverter/
          cp -a WebDev-L2-Calculator/. _site/WebDev-L2-Calculator/

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
